meta:
  appTitle: "OnlineZap Backend"
  toolchain: docker

services:
  backendlonlinezap:
    image: backend
    build:
      context: .
      dockerfile: Dockerfile
    containerPort: 80
    persistence:
      - mount: /data
        name: backend-data
    args: []

postgresql:
  - name: onlinezap-db
    version: "16"
    disks:
      etalon:
        size: 1024
