meta:
  environment: docker
  toolchain:
    name: docker
    version: "1.0"

services:
  onlinezap-backend:
    image: backend
    build:
      context: .
      dockerfile: Dockerfile
    containerPort: 80
    persistence:
      - mount: /data
        name: backend-data

postgresql:
  - name: onlinezap-db
    version: "16"
    disks:
      etalon:
        size: 1024
